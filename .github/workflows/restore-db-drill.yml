name: Database restore drill

on:
  workflow_dispatch:
    inputs:
      minimum_sightings:
        type: number
        default: 1
        description: Fail if fewer sightings restore
      minimum_embeddings:
        type: number
        default: 1
        description: Fail if fewer MiewID vectors restore

permissions:
  contents: read

concurrency:
  group: database-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    if: vars.RESTORE_DRILL_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: backup-restore
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build disposable Postgres with PostGIS and pgvector
        run: docker build -t indiedex-restore-db ./docker/db
      - name: Restore latest backup in isolation and discard it
        env:
          RESTORE_BACKUP_BUCKET: ${{ secrets.RESTORE_BACKUP_BUCKET }}
          RESTORE_BACKUP_ENDPOINT: ${{ secrets.RESTORE_BACKUP_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RESTORE_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.RESTORE_BACKUP_REGION || 'ap-south-1' }}
          MINIMUM_SIGHTINGS: ${{ inputs.minimum_sightings }}
          MINIMUM_EMBEDDINGS: ${{ inputs.minimum_embeddings }}
        run: |
          python backend/scripts/restore_db_drill.py \
            --minimum-sightings "$MINIMUM_SIGHTINGS" \
            --minimum-embeddings "$MINIMUM_EMBEDDINGS"
      # No dump, database volume, inventory, counts or raw tool logs are
      # uploaded. A killed hosted runner is discarded along with its tmpfs.
