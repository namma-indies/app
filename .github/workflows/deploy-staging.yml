name: Deploy Staging

# Two ways in:
#   - dispatched by hand against whatever branch you pick in the Actions UI
#     (GITHUB_REF_NAME below is that branch), to try work before it merges;
#   - called by deploy.yml with `branch: main` on every merge, so main lands
#     here and has to answer before it goes on to argos. Before that, nothing
#     moved staging but a dispatch, and main could run three weeks ahead of it.
# Requires two repo secrets distinct from the prod ones:
#   STAGING_SSH_KEY    - private half of a CI-only keypair for the staging box
#   STAGING_SSH_TARGET - e.g. "ubuntu@<staging-box-ip>"

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      branch:
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Queue rather than cancel: a deploy can now be partway through rolling the
    # database back, and cancelling a main deploy here would also skip prod.
    # Job-level because a called workflow's own top-level concurrency is not
    # reliably honoured.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      # main's copy of the deploy script, whichever branch is being deployed,
      # so the database rollback in it doesn't depend on the branch being
      # rebased. (A dispatch runs the workflow file from the chosen branch, so
      # this only holds for branches that already have this line. Deploys of
      # main -- the move that matters -- always do.)
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to staging
        env:
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_SSH_TARGET: ${{ secrets.STAGING_SSH_TARGET }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          # BRANCH went in as an env prefix on the ssh command, which a forced
          # command discards -- so remote-staging.sh would have hit its
          # `BRANCH:?` and failed. This workflow had never been run, so nothing
          # ever surfaced it. Same trap backfill.yml and seed-models.yml each
          # hit and documented. Settings go through stdin; the action name
          # carries the branch for the wrapper.
          #
          # The action name is sent alongside, so this works whether the box
          # still has `command="bash -s"` (name discarded, stdin runs) or
          # deploy/authorized-command.sh (name honoured, stdin dropped).
          { printf 'BRANCH=%s\n' "$BRANCH"; cat deploy/remote-staging.sh; } \
            | ssh -i "$key_file" -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=accept-new \
                "$DEPLOY_SSH_TARGET" "deploy-staging $BRANCH"

      - name: Wait for the app to answer
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://staging.nammaindies.org/ || true)
            if [ "$code" = "200" ]; then echo "==> live (HTTP $code)"; exit 0; fi
            sleep 3
          done
          echo "!! app did not return 200 after 90s" >&2
          exit 1
