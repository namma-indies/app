name: Deploy Android (Play Console internal testing)

on:
  # A tag is the release. Pushing v1.2.3 ships iOS and Android together from one
  # commit, which is also what makes "which build are the testers on?"
  # answerable. Deliberately NOT on every merge to main like the web deploy:
  # most merges cannot change the native bundle at all (the wrappers only carry
  # frontend/dist), each build burns a store build number, and TestFlight's
  # external groups need a review pass per first build.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Kept for one-offs and for testing this pipeline without minting a version.
  workflow_dispatch: {}

concurrency:
  group: android-play-deploy
  cancel-in-progress: false

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the tag-is-on-main guard below needs it, and a
          # shallow clone makes `merge-base --is-ancestor` unanswerable.
          fetch-depth: 0

      - name: Resolve the release version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Exact match, not a glob: a `case` pattern like v[0-9]*.[0-9]*.[0-9]*
            # also accepts v1.1.0-beta, and a prerelease suffix is not a legal
            # iOS CFBundleShortVersionString -- so it would sail past here and
            # fail much later, during the upload, with an unrelated-looking
            # error. Rejected up front instead.
            if ! printf '%s' "$GITHUB_REF_NAME" \
                 | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$GITHUB_REF_NAME' is not a v<major>.<minor>.<patch>"\
                   "release tag (no prerelease suffixes -- iOS rejects them)"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            echo "::notice::releasing $version from $GITHUB_SHA"
          else
            # A dispatched build is not a release. 0.0.N says so at a glance in
            # the store console, and versionName ordering carries no meaning to
            # either store -- only the build number / versionCode does.
            version="0.0.$GITHUB_RUN_NUMBER"
            echo "::notice::manual build $version (not a tagged release)"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to ship a tag that is not on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main -- a store build must come"\
                 "from what the web is already serving"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps and build web assets
        run: |
          npm ci
          npm run build

      # Capacitor 8's generated capacitor.build.gradle sets compileOptions to
      # Java 21 (sourceCompatibility/targetCompatibility VERSION_21) — do not
      # "helpfully" downgrade this back to 17, the build will fail to compile.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: frontend/android

      - name: Sync web build into the Capacitor Android project
        run: npx cap sync android

      - name: Decode the upload keystore
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/frontend/android/app/upload-keystore.jks

      - name: Build and upload to the internal testing track
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # versionCode stays the run number: Play requires it to increase
          # monotonically, and a semver tag is not a monotonic integer -- nor
          # would re-running one tag produce a fresh code.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: bundle exec fastlane build_and_upload
