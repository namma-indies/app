name: Deploy iOS (TestFlight)

on:
  # A tag is the release. Pushing v1.2.3 ships iOS and Android together from one
  # commit, which is also what makes "which build are the testers on?"
  # answerable. Deliberately NOT on every merge to main like the web deploy:
  # most merges cannot change the native bundle at all (the wrappers only carry
  # frontend/dist), each build burns a store build number, and TestFlight's
  # external groups need a review pass per first build.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Kept for one-offs and for testing this pipeline without minting a version.
  workflow_dispatch: {}

concurrency:
  group: ios-testflight-deploy
  cancel-in-progress: false

jobs:
  build_and_upload:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      changelog: ${{ steps.version.outputs.changelog }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the tag-is-on-main guard below needs it, and a
          # shallow clone makes `merge-base --is-ancestor` unanswerable.
          fetch-depth: 0

      - name: Resolve the release version
        id: version
        env:
          EOF_MARKER: NI_CHANGELOG_EOF
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Exact match, not a glob: a `case` pattern like v[0-9]*.[0-9]*.[0-9]*
            # also accepts v1.1.0-beta, and a prerelease suffix is not a legal
            # iOS CFBundleShortVersionString -- so it would sail past here and
            # fail much later, during the upload, with an unrelated-looking
            # error. Rejected up front instead.
            if ! printf '%s' "$GITHUB_REF_NAME" \
                 | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$GITHUB_REF_NAME' is not a v<major>.<minor>.<patch>"\
                   "release tag (no prerelease suffixes -- iOS rejects them)"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            echo "::notice::releasing $version from $GITHUB_SHA"
            # The tag annotation becomes TestFlight's "What to Test". Writing
            # release notes twice is how they drift, so there is one source.
            # Lightweight tags yield nothing here; the Fastfile falls back.
            # Any line that collides with the heredoc delimiter is dropped
            # rather than allowed to terminate the value early -- that is an
            # output-injection hole, not a formatting nit.
            changelog="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" \
                         | grep -vxF "$EOF_MARKER" || true)"
          else
            # A dispatched build is not a release. 0.0.N says so at a glance in
            # the store console, and versionName ordering carries no meaning to
            # either store -- only the build number / versionCode does.
            version="0.0.$GITHUB_RUN_NUMBER"
            echo "::notice::manual build $version (not a tagged release)"
            changelog=""
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<$EOF_MARKER"
            echo "$changelog"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to ship a tag that is not on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main -- a store build must come"\
                 "from what the web is already serving"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >=22 (bumped from the plan's
          # original 20 after Task 2 ended up on Capacitor 8 -- see
          # docs/specs/2026-08-05-ios-app-design.md's final-review notes).
          node-version: "22"

      - name: Install frontend deps and build web assets
        run: |
          npm ci
          npm run build

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: frontend/ios

      - name: Sync web build into the Capacitor iOS project
        run: npx cap sync ios

      - name: Build and upload to TestFlight
        working-directory: frontend/ios
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # Only set on a tag. App Store Connect treats the marketing version as
          # an App Store *version* record, so stamping a dispatched build 0.0.N
          # would litter it with junk versions; untagged builds keep whatever the
          # Xcode project says and land under the existing version instead.
          RELEASE_VERSION_NAME: ${{ github.ref_type == 'tag' && steps.version.outputs.name || '' }}
        run: bundle exec fastlane build_and_upload

  # Uploading a build and putting it in front of testers are two different
  # things, and only the first was ever automated -- so every tagged release
  # from 2026-08-08 onward landed in App Store Connect unassigned while the
  # external group kept serving the build from 2026-08-09.
  #
  # This cannot be folded into the job above: fastlane documents that
  # `distribute_external` does nothing when `skip_waiting_for_build_processing`
  # is set, and dropping that flag would hold a macOS runner -- billed at 10x
  # -- idle for the 10-30 minutes Apple spends processing. A separate job on
  # Ubuntu does the same work at 1x, and needs no Xcode, no signing certs and
  # no keychain: it is pure App Store Connect API.
  #
  # Tags only. A dispatched build deliberately does not stamp a marketing
  # version, so there is no version for it to be distributed under, and a
  # throwaway build has no business reaching external testers.
  distribute:
    needs: build_and_upload
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: frontend/ios

      - name: Hand the build to the testers
        working-directory: frontend/ios
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RELEASE_VERSION_NAME: ${{ needs.build_and_upload.outputs.version }}
          # Shown to testers as "What to Test". The tag's annotation is what a
          # release note already is, so use it rather than inventing a second
          # place to write one.
          RELEASE_CHANGELOG: ${{ needs.build_and_upload.outputs.changelog }}
        run: bundle exec fastlane distribute
