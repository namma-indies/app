name: Seed model weights
# Exports the ONNX models and puts them where the app can find them, without
# anyone downloading 429 MB to a laptop or handling production credentials by
# hand.
#
# The weights are gitignored, so a fresh box has none and re-ID runs inert:
# both background tasks catch the missing model, every upload saves with no
# embedding, and /health reports "reid": "degraded". This is the job that fixes
# that, and it should need running roughly never -- once per environment, and
# again only if a model is re-exported.
#
# Deliberately manual. It costs several minutes of runner time and rewrites what
# production infers identity with; that is not something to trigger on a push.
#
# Uses only secrets this repo already has (DEPLOY_SSH_* / STAGING_SSH_*). The
# box holds its own S3 credentials in its .env, so they are never copied into
# GitHub: the runner ships the files over SSH and the box uploads them itself.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which box to seed
        type: choice
        options: [staging, production]
        default: staging
      upload_to_s3:
        description: >-
          Also push to object storage, so future boxes and rebuilds fetch them
          automatically instead of needing this job again
        type: boolean
        default: true

concurrency:
  group: seed-models-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the exporters need torch; the service must never have it. This
      # runs on a throwaway runner precisely so that stays true.
      # torch and torchvision must come from the SAME index in one command.
      # Installing torch from the CPU index and letting a later package pull
      # torchvision from PyPI gets a torchvision built against a different torch,
      # and its C++ ops fail to register:
      #     RuntimeError: operator torchvision::nms does not exist
      # which surfaces as an import error inside transformers, nowhere near the
      # actual cause.
      # torch and torchvision must come from the SAME build. Installing torch
      # from the CPU index and then letting another package pull torchvision
      # from PyPI gets one built against a different torch, whose C++ ops never
      # register:
      #     RuntimeError: operator torchvision::nms does not exist
      # It surfaces as an import failure deep inside transformers, nowhere near
      # the cause. So everything else goes in first and the CPU index gets the
      # last word, then the pair is checked before any export runs.
      - name: Install export toolchain
        run: |
          python -m pip install --upgrade pip
          # onnxruntime is not optional: export_miewid_onnx.py loads the export
          # back and refuses to write one that drifts from the torch original.
          pip install transformers timm onnx onnxruntime onnxscript ultralytics pillow numpy
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python - <<'EOF'
          import torch, torchvision
          print(f"torch {torch.__version__} / torchvision {torchvision.__version__}")
          torch.ops.torchvision.nms  # resolves the op registry, or raises here
          print("torchvision ops registered OK")
          # Import everything the two exporters touch, so a missing package
          # fails here rather than part-way through a five-minute export.
          import numpy, onnx, onnxruntime, timm, transformers, ultralytics
          from PIL import Image
          print("all export dependencies import OK")
          EOF

      - name: Export MiewID-msv3
        run: python scripts/export_miewid_onnx.py

      - name: Export YOLO26x
        run: python scripts/export_yolo26x_onnx.py

      # export_miewid_onnx.py already refuses to write an export that drifts
      # from the torch original (cosine < 0.9999). This only catches the cruder
      # failure of a file that is present but truncated.
      - name: Verify exports
        run: |
          set -e
          for f in backend/app/ml/miewid_msv3.onnx backend/app/ml/yolo26x.onnx; do
            test -f "$f" || { echo "::error::$f was not produced"; exit 1; }
            size=$(stat -c%s "$f")
            echo "$f: $((size / 1000000)) MB"
            [ "$size" -gt 150000000 ] || { echo "::error::$f is implausibly small"; exit 1; }
          done

      - name: Ship to the box
        env:
          SSH_KEY: ${{ inputs.environment == 'production'
            && secrets.DEPLOY_SSH_KEY || secrets.STAGING_SSH_KEY }}
          SSH_TARGET: ${{ inputs.environment == 'production'
            && secrets.DEPLOY_SSH_TARGET || secrets.STAGING_SSH_TARGET }}
          UPLOAD: ${{ inputs.upload_to_s3 }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          # BatchMode and ConnectTimeout are the whole point here. Without them
          # ssh waits on a prompt nobody can answer -- a missing secret, an
          # unknown host key, a box that never accepts the connection all look
          # identical: a step that emits nothing and runs until the job timeout.
          # Two runs were lost to exactly that. Fail in seconds instead.
          COMMON="-o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes"
          COMMON="$COMMON -o StrictHostKeyChecking=accept-new"
          SSH="ssh -i $key_file $COMMON"

          if [ -z "${SSH_TARGET:-}" ]; then
            echo "::error::no SSH target for ${{ inputs.environment }} -- is the secret set?"
            exit 1
          fi

          echo "==> checking we can reach $SSH_TARGET"
          $SSH -n "$SSH_TARGET" 'echo connected as $(whoami) on $(hostname)'

          echo "==> copying weights (429 MB, this is the slow part)"
          scp -i "$key_file" $COMMON \
            backend/app/ml/miewid_msv3.onnx backend/app/ml/yolo26x.onnx \
            "$SSH_TARGET:/tmp/"

          echo "==> seeding on the box"
          # Settings via stdin, not an env prefix -- the deploy key is pinned in
          # authorized_keys with `command="bash -s"`, and a forced command drops
          # the client's command string, so UPLOAD never arrived and the script
          # silently used its default. Same fix as backfill.yml.
          {
            printf 'UPLOAD=%s\n' "$UPLOAD"
            cat deploy/remote-seed-models.sh
          } | $SSH "$SSH_TARGET" 'bash -s'

      - name: Confirm re-ID came up ready
        env:
          BASE: ${{ inputs.environment == 'production'
            && 'https://app.nammaindies.org' || '' }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::notice::no public URL for ${{ inputs.environment }}; check /health on the box"
            exit 0
          fi
          for i in $(seq 1 30); do
            body=$(curl -s "$BASE/health" || true)
            echo "$body"
            case "$body" in
              *'"reid":"ready"'*) echo "::notice::re-ID is ready"; exit 0 ;;
            esac
            sleep 4
          done
          echo "::error::/health never reported reid: ready"
          exit 1
